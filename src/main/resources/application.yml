server:
  port: ${APP_PORT:7654}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/equipment_maint?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:equip}
    password: ${DB_PASSWORD:equip123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: 120000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

app:
  jwt-secret: ${JWT_SECRET:equipment-maintenance-admin-dev-secret-change-me-please-32bytes}
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD:admin123}
  attachment:
    # 文件内容存储目录（容器内建议挂载持久卷），MySQL 只保存元数据
    storage-dir: ${ATTACHMENT_STORAGE_DIR:./data/attachments}
    # 单个证据大小上限（字节），默认 100MB
    max-size-bytes: ${ATTACHMENT_MAX_SIZE:104857600}
    # 单个分片大小上限（字节），默认 10MB
    max-chunk-size-bytes: ${ATTACHMENT_MAX_CHUNK_SIZE:10485760}
    # 分片上传会话有效期（小时）
    session-ttl-hours: ${ATTACHMENT_SESSION_TTL_HOURS:24}
    # 过期/失败临时分片定时清理（每小时 17 分执行）
    cleanup-cron: ${ATTACHMENT_CLEANUP_CRON:0 17 * * * *}
